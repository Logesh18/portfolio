services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logesh-portfolio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-12000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      ollama:
        condition: service_started
    networks:
      - public_edge
      - inference_internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: logesh-portfolio-ollama
    restart: unless-stopped
    # Notice: NO public ports mapped to host by default in production.
    # Reachable ONLY by the Next.js server over the private inference_internal network.
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - inference_internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

networks:
  public_edge:
    driver: bridge
  inference_internal:
    driver: bridge
    internal: true

volumes:
  ollama_models:
